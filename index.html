<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Holi My Love</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #fff5f8, #f0e6ff);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .message-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            z-index: 10;
            border: 3px solid #ff80ab;
            max-width: 80%;
        }

        h1 {
            color: #d81b60;
            font-size: 2.5rem;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        p {
            color: #6a1b9a;
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.5;
        }

        /* Music Button */
        #music-btn {
            margin-top: 25px;
            padding: 12px 25px;
            background-color: #ff80ab;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(255, 128, 171, 0.4);
            transition: 0.3s;
        }

        #music-btn:hover {
            background-color: #d81b60;
            transform: scale(1.05);
        }

        /* Heart Animation */
        .heart {
            position: absolute;
            bottom: -10%;
            font-size: 2rem;
            user-select: none;
            z-index: 1;
            animation: floatUp 5s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
        <source src="https://pixabay.com/music/download/romantic-piano-110053.mp3" type="audio/mpeg">
    </audio>

    <div class="message-card">
        <h1>Happy Holi, My Love! 🎨</h1>
        <p>Thank you for filling my life with colours.</p>
        <button id="music-btn" onclick="playMusic()">Tap for Music 🎵</button>
    </div>

    <script>
        // Music Function
        function playMusic() {
            const audio = document.getElementById("bgMusic");
            const btn = document.getElementById("music-btn");
            
            if (audio.paused) {
                audio.play().catch(error => {
                    console.log("Playback failed. Please try again.");
                });
                btn.innerHTML = "Music is Playing... ❤️";
                btn.style.backgroundColor = "#6a1b9a";
            } else {
                audio.pause();
                btn.innerHTML = "Tap for Music 🎵";
                btn.style.backgroundColor = "#ff80ab";
            }
        }

        // Heart Spawner
        const colors = ['#FF1493', '#FF4500', '#FFD700', '#32CD32', '#00BFFF', '#FF69B4', '#8A2BE2'];
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤'; 
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            
            const duration = Math.random() * 3 + 3;
            heart.style.animationDuration = duration + 's';
            
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, duration * 1000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
